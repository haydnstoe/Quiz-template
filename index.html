<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Quiz</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#333;
}

#progress{
    font-weight:bold;
    margin-bottom:20px;
}

.question{
    font-size:1.4rem;
    margin-bottom:25px;
    color:#222;
}

.answers{
    display:grid;
    gap:12px;
}

.answer-btn{
    border:none;
    padding:14px;
    border-radius:8px;
    background:#e8edf2;
    cursor:pointer;
    font-size:1rem;
    transition:.2s;
}

.answer-btn:hover:not(:disabled){
    background:#dbe4ec;
}

.answer-btn:disabled{
    cursor:not-allowed;
}

.correct{
    background:#28a745 !important;
    color:white;
}

.incorrect{
    background:#dc3545 !important;
    color:white;
}

#results{
    text-align:center;
    display:none;
}

#restart{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#0078d4;
    color:white;
    cursor:pointer;
    font-size:1rem;
}

#restart:hover{
    background:#005ea6;
}
</style>
</head>
<body>

<div class="container">

<h1>Vocabulary Quiz</h1>

<div id="quizArea">
    <div id="progress"></div>
    <div id="question" class="question"></div>
    <div id="answers" class="answers"></div>
</div>

<div id="results">
    <h2>Quiz Complete!</h2>
    <p id="finalScore"></p>
    <button id="restart">Play Again</button>
</div>

</div>

<script>

const vocabulary = [

{
    word:"decadent",
    synonym:"self-indulgent",
    antonym:"frugal"
},
{
    word:"obligatory",
    synonym:"mandatory",
    antonym:"optional"
},
{
    word:"bovine",
    synonym:"cow-like",
    antonym:"feline"
},
{
    word:"carnivore",
    synonym:"meat-eater",
    antonym:"herbivore"
},
{
    word:"herbivore",
    synonym:"plant-eater",
    antonym:"carnivore"
},
{
    word:"omnivore",
    synonym:"eats both plants and meat",
    antonym:"herbivore"
},
{
    word:"despondent",
    synonym:"dejected",
    antonym:"hopeful"
},
{
    word:"satirise",
    synonym:"mock",
    antonym:"praise"
},
{
    word:"supplant",
    synonym:"replace",
    antonym:"retain"
},
{
    word:"correspondent",
    synonym:"writer",
    antonym:"recipient"
},
{
    word:"penalise",
    synonym:"punish",
    antonym:"reward"
},
{
    word:"vivacious",
    synonym:"lively",
    antonym:"lifeless"
}

];

function shuffle(array){

    const copy = [...array];

    for(let i = copy.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] =
        [copy[j], copy[i]];
    }

    return copy;
}

function getDistractors(correct){

    const pool = [];

    vocabulary.forEach(item => {

        pool.push(item.synonym);
        pool.push(item.antonym);

    });

    return shuffle(
        pool.filter(
            value => value !== correct
        )
    ).slice(0,3);
}

const questions = [];

vocabulary.forEach(item => {

    questions.push({
        type:"synonym",
        word:item.word,
        correct:item.synonym
    });

    questions.push({
        type:"antonym",
        word:item.word,
        correct:item.antonym
    });

});

let quizQuestions = shuffle(questions);
let currentQuestion = 0;
let score = 0;

function loadQuestion(){

    const q = quizQuestions[currentQuestion];

    document.getElementById("progress").textContent =
        `Question ${currentQuestion + 1} of ${quizQuestions.length}`;

    document.getElementById("question").textContent =
        `Choose the ${q.type} of "${q.word}"`;

    const answers =
        shuffle([
            q.correct,
            ...getDistractors(q.correct)
        ]);

    const answersDiv =
        document.getElementById("answers");

    answersDiv.innerHTML = "";

    answers.forEach(answer => {

        const button =
            document.createElement("button");

        button.className = "answer-btn";

        button.textContent = answer;

        button.addEventListener(
            "click",
            () => checkAnswer(button, answer)
        );

        answersDiv.appendChild(button);

    });
}

function checkAnswer(button, selected){

    const q = quizQuestions[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer-btn");

    buttons.forEach(btn => btn.disabled = true);

    if(selected === q.correct){

        score++;

        button.classList.add("correct");

    } else {

        button.classList.add("incorrect");

        buttons.forEach(btn => {

            if(btn.textContent === q.correct){

                btn.classList.add("correct");
            }
        });
    }

    setTimeout(() => {

        currentQuestion++;

        if(currentQuestion < quizQuestions.length){

            loadQuestion();

        } else {

            showResults();
        }

    }, 1000);
}

function showResults(){

    document.getElementById("quizArea").style.display =
        "none";

    document.getElementById("results").style.display =
        "block";

    document.getElementById("finalScore").textContent =
        `You scored ${score} out of ${quizQuestions.length}.`;
}

document
.getElementById("restart")
.addEventListener("click", () => {

    quizQuestions = shuffle(questions);
    currentQuestion = 0;
    score = 0;

    document.getElementById("results").style.display =
        "none";

    document.getElementById("quizArea").style.display =
        "block";

    loadQuestion();

});

loadQuestion();

</script>

</body>
</html>
